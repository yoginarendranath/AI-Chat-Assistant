<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Chat Assistant</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="logo">
                🤖
            </div>

            <div>
                <h2>AI Assistant</h2>
                <span>Smart Chat</span>
            </div>

        </div>


        <button
                id="newChatBtn"
                class="new-chat">

            + New Chat

        </button>


        <div class="recent">

            <h3>RECENT CHATS</h3>

            <div id="conversationList">
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="header">

            <div>

                <h1>
                    AI Chat Assistant
                </h1>

                <div class="online">

                    <span></span>

                    Online

                </div>

            </div>


            <button
                    id="clearBtn"
                    class="clear-btn">

                🗑️

            </button>

        </header>


        <!-- CHAT -->

        <div
                id="chatBox"
                class="chat-box">

            <div
                    id="welcome"
                    class="welcome">

                <div class="big-logo">
                    🤖
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask me anything and I'll
                    do my best to help.
                </p>


                <div class="suggestions">

                    <button
                            onclick="useSuggestion('Explain Java')">

                        ☕ Explain Java

                    </button>


                    <button
                            onclick="useSuggestion('What is Spring Boot?')">

                        🌱 Spring Boot

                    </button>


                    <button
                            onclick="useSuggestion('Give me project ideas')">

                        💡 Project Ideas

                    </button>


                    <button
                            onclick="useSuggestion('Teach me SQL')">

                        🗄️ Learn SQL

                    </button>

                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-section">

            <div class="input-box">

                <button
                        id="voiceBtn"
                        class="voice">

                    🎤

                </button>


                <input
                        id="messageInput"
                        type="text"
                        placeholder="Type your message..."
                        autocomplete="off">


                <button
                        id="sendBtn"
                        class="send">

                    ➤

                </button>

            </div>


            <p>
                AI can make mistakes.
                Check important information.
            </p>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
